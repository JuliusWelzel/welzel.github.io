name: Update publications

# Collects publications from ORCID, OpenAlex, Crossref and Google Scholar
# (scripts/update_publications.py), re-renders the Quarto site when the list
# changed, commits the result and publishes it to the gh-pages branch.

on:
  schedule:
    # Mondays at 05:17 UTC
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "publications/config.yml"
      - "scripts/update_publications.py"
      - "scripts/requirements.txt"
      - ".github/workflows/update-publications.yml"

permissions:
  contents: write
  actions: write   # keep-alive for the schedule (see below)

concurrency:
  group: update-publications-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GitHub switches off scheduled workflows after 60 days without
      # repository activity, which would stop the weekly update in quiet
      # periods. Re-enabling the workflow on every scheduled run resets that
      # clock.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable update-publications.yml --repo "${{ github.repository }}" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications
        id: fetch
        env:
          # Optional: an OpenAlex API key raises the rate limit.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_publications.py

      # Weekly runs only re-render when the publication list changed;
      # manual and push-triggered runs always re-render.
      - name: Set up Quarto
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Render website
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        run: quarto render

      - name: Commit changes
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add publications projects/_pubs docs
          # Quarto rewrites docs/sitemap.xml (<lastmod>) on every render, so it
          # does not count as a change on its own.
          if git diff --cached --quiet -- . ':(exclude)docs/sitemap.xml'; then
            git reset --quiet
            git checkout -- docs/sitemap.xml 2>/dev/null || true
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update publications (${{ steps.fetch.outputs.count }} entries)"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Publish to gh-pages
        if: >-
          github.ref_name == github.event.repository.default_branch &&
          (steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule')
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
