project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!projects/foot-placement.qmd"   # hidden for now
    - "!talks/"                         # hidden for now
  resources:
    - assets/js/
    - .nojekyll

website:
  title: "Julius Welzel"
  site-url: https://juliuswelzel.github.io/welzel.github.io/
  description: "Cognitive neuroscientist working on movement, mobile EEG and open, reproducible research."
  image: images/eeg.jpg
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: false
    left:
      - text: Research
        href: research/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: Software
        href: software/index.qmd
      - text: Teaching
        href: teaching/index.qmd
    right:
      - icon: envelope
        aria-label: Email
        href: "mailto:julius.welzel@gmail.com"
      - icon: github
        aria-label: GitHub
        href: https://github.com/JuliusWelzel
      - icon: mortarboard
        aria-label: Google Scholar
        href: https://scholar.google.com/citations?user=CWxKXBcAAAAJ
      - icon: person-badge
        aria-label: ORCID
        href: https://orcid.org/0000-0001-8958-0934
      - icon: mastodon
        aria-label: Mastodon
        href: https://mastodon.online/@JuliusWelzel
  page-footer:
    left: "© Julius Welzel"
    center: "Built with [Quarto](https://quarto.org) · publications updated weekly"
    right:
      - text: Impressum
        href: impressum/index.qmd

format:
  html:
    theme: [default, theme.scss]
    title-block-style: none
    toc: false
    smooth-scroll: true
    link-external-newwindow: false
    include-in-header:
      - file: assets/motion-loader.html
